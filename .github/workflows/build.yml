name: Build & Release

on:
  workflow_dispatch:
  pull_request:
    branches: "*"
    paths-ignore:
      - '**/README.md'
   
env:
  DOTNET_NOLOGO: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: compute
        run: |
          last=$(git tag --merged HEAD | grep -E '^[vV]?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | sed 's/^[vV]//' | sort -V | tail -1)
          IFS=. read -r major minor patch build <<< "${last:-0.0.0.0}"
          version="$major.$minor.$patch.$(( ${build:-0} + 1 ))"
          echo "Last tag: ${last:-none}, version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.compute.outputs.version }}

  build:
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      matrix:
        runner: [ windows-latest, ubuntu-latest, macos-latest ]
        project: [ {name: Server, extraArgs: ' -p:PublishSingleFile=true --self-contained false'}, {name: CentrED, extraArgs: ''} ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Set version
        shell: bash
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          perl -pi -e 's/(Assembly(File)?Version)\("[^"]*"\)/$1("$ENV{V}")/; s/(AssemblyInformationalVersion)\("[^"]*"\)/$1("$ENV{V}+$ENV{GITHUB_SHA}")/' */AssemblyInfo.cs
      - name: Publish
        run: dotnet publish ${{ matrix.project.name }} -c Release -o release_${{ matrix.project.name }} -p:DebugType=None ${{ matrix.project.extraArgs }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ github.workspace }}/release_${{ matrix.project.name }}/*
          
  release:
    runs-on: ubuntu-latest
    needs: [ version, build ]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Install zip
        uses: montudor/action-zip@v1
          
      - name: Create archives
        run: |
          cd artifacts
          mkdir release
          zip -qq -r release/Cedserver-Linux-x64-$VERSION.zip Server-Linux-X64/
          zip -qq -r release/Cedserver-Windows-x64-$VERSION.zip Server-Windows-X64/
          zip -qq -r release/Cedserver-macOS-arm64-$VERSION.zip Server-macOS-ARM64/
          zip -qq -r release/CentrED-Linux-x64-$VERSION.zip CentrED-Linux-X64/
          zip -qq -r release/CentrED-Windows-x64-$VERSION.zip CentrED-Windows-X64/
          zip -qq -r release/CentrED-macOS-arm64-$VERSION.zip CentrED-macOS-ARM64/
            
      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: artifacts/release/*
          generateReleaseNotes: true
          makeLatest: true
          commit: ${{ github.sha }}
          tag: ${{ env.VERSION }}
